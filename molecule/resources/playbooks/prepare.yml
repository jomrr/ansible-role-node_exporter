---
# role: node_exporter
# file: molecule/resources/playbooks/prepare.yml

- name: Prepare the test platforms
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh package metadata and install the test certificate dependency
      become: true
      become_user: root
      ansible.builtin.package:
        name: python3-cryptography
        state: present
        update_cache: true
