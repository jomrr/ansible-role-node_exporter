---
# role: node_exporter
# file: molecule/resources/playbooks/verify.yml

- name: Verify the running exporter
  hosts: all
  gather_facts: true
  vars:
    __node_exporter_verify_binary: false
    __node_exporter_verify_tls: false
    __node_exporter_verify_local_only: true
    __node_exporter_verify_port: 9100
    __node_exporter_verify_url: "http://127.0.0.1:{{ __node_exporter_verify_port }}/metrics"
  tasks:
    - name: Load platform settings
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: set_vars
        public: true

    - name: Scrape the configured listener
      ansible.builtin.uri:
        url: "{{ __node_exporter_verify_url }}"
        use_proxy: false
        use_netrc: false
        ca_path: "{{ '/etc/node_exporter-test/server.crt' if __node_exporter_verify_tls else omit }}"
        client_cert: "{{ '/etc/node_exporter-test/client.crt' if __node_exporter_verify_tls else omit }}"
        client_key: "{{ '/etc/node_exporter-test/client.key' if __node_exporter_verify_tls else omit }}"
        url_username: "{{ 'monitor' if __node_exporter_verify_tls else omit }}"
        url_password: "{{ 'fixture-web-auth-92e7' if __node_exporter_verify_tls else omit }}"
        force_basic_auth: "{{ __node_exporter_verify_tls }}"
        return_content: true
      no_log: "{{ __node_exporter_verify_tls }}"
      register: __node_exporter_metrics
      until: __node_exporter_metrics.status == 200
      retries: 10
      delay: 1

    - name: Verify the metrics port is closed on the host network address
      ansible.builtin.wait_for:
        host: "{{ ansible_facts.default_ipv4.address }}"
        port: "{{ __node_exporter_verify_port }}"
        state: stopped
        timeout: 3
      when: __node_exporter_verify_local_only

    - name: Require a client certificate on the remote listener
      ansible.builtin.uri:
        url: "{{ __node_exporter_verify_url }}"
        use_proxy: false
        use_netrc: false
        ca_path: /etc/node_exporter-test/server.crt
        status_code: -1
      register: __node_exporter_denied
      failed_when: __node_exporter_denied.status != -1 or 'SSL' not in __node_exporter_denied.msg
      when: __node_exporter_verify_tls

    - name: Require Basic Auth after successful client authentication
      ansible.builtin.uri:
        url: "{{ __node_exporter_verify_url }}"
        use_proxy: false
        use_netrc: false
        ca_path: /etc/node_exporter-test/server.crt
        client_cert: /etc/node_exporter-test/client.crt
        client_key: /etc/node_exporter-test/client.key
        status_code: 401
      when: __node_exporter_verify_tls

    - name: Verify the build and configured collector metrics
      ansible.builtin.assert:
        that:
          - __node_exporter_metrics.content is search('(?m)^node_exporter_build_info[{]')
          - (__node_exporter_metrics.content is search('(?m)^node_uname_info[{]')) != __node_exporter_verify_binary
          - __node_exporter_metrics.content is search('(?m)^node_network_receive_bytes_total[{][^}]*device="lo"')
          - __node_exporter_metrics.content is search('(?m)^node_filesystem_size_bytes[{][^}]*mountpoint="/home/node-exporter-test"')
          - __node_exporter_metrics.content is search('(?m)^node_filesystem_readonly[{][^}]*mountpoint="/home/node-exporter-test"[^}]*[}] 0$')
          - __node_exporter_metrics.content is search('(?m)^node_systemd_unit_state[{][^}]*state="active"[^}]*[}] 1$')
        quiet: true

    - name: Read the distribution service state
      ansible.builtin.systemd_service:
        name: "{{ __node_exporter_service }}"
        state: started
      check_mode: true
      register: __node_exporter_running

    - name: Read the kernel status of the exporter process
      ansible.builtin.slurp:
        src: "/proc/{{ __node_exporter_running.status.MainPID }}/status"
      register: __node_exporter_process_status

    - name: Verify the effective service sandbox
      ansible.builtin.assert:
        that:
          - __node_exporter_running.status.NoNewPrivileges | bool
          - __node_exporter_running.status.ProtectSystem == 'strict'
          - __node_exporter_process_status.content | b64decode is search('(?m)^CapBnd:\s+0+$')
          - __node_exporter_running.status.RestrictNamespaces | bool
          - __node_exporter_running.status.RestrictAddressFamilies.split() | sort == ['AF_INET', 'AF_INET6', 'AF_NETLINK', 'AF_UNIX']
        quiet: true

    - name: Read the running exporter command line
      ansible.builtin.slurp:
        src: "/proc/{{ __node_exporter_running.status.MainPID }}/cmdline"
      register: __node_exporter_cmdline

    - name: Inspect the local command link
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
        get_checksum: false
      register: __node_exporter_command

    - name: Verify the enabled service uses the selected executable
      ansible.builtin.assert:
        that:
          - __node_exporter_running.status.ActiveState == 'active'
          - __node_exporter_running.status.UnitFileState == 'enabled'
          - __node_exporter_command.stat.exists == __node_exporter_verify_binary
          - __node_exporter_exe == '/usr/local/bin/node_exporter' if __node_exporter_verify_binary else __node_exporter_exe.startswith('/usr/bin/')
        quiet: true
      vars:
        __node_exporter_exe: "{{ __node_exporter_cmdline.content | b64decode | regex_search('^[/a-zA-Z0-9_-]+') }}"

    - name: Match the running upstream version to the linked release
      ansible.builtin.assert:
        that:
          - __node_exporter_command.stat.lnk_target is match('/usr/local/libexec/node_exporter/node_exporter-[0-9]+[.][0-9]+[.][0-9]+$')
          - ('version="' ~ __node_exporter_command.stat.lnk_target.split('-')[-1] ~ '"') in __node_exporter_metrics.content
        quiet: true
      when: __node_exporter_verify_binary
