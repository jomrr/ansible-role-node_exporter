---
# role: node_exporter
# file: molecule/resources/playbooks/side_effect.yml

- name: NODE_EXPORTER | Switch to the latest upstream release
  hosts: all
  gather_facts: true
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      node_exporter_install: binary
      node_exporter_listen_address: '127.0.0.1:19100'
      node_exporter_collectors:
        uname: false

- name: NODE_EXPORTER | Verify the upstream executable and new listener
  ansible.builtin.import_playbook: verify.yml
  vars:
    __node_exporter_verify_binary: true
    __node_exporter_verify_port: 19100

- name: NODE_EXPORTER | Restore the distribution executable and default settings
  ansible.builtin.import_playbook: converge.yml

- name: NODE_EXPORTER | Verify the restored package service
  ansible.builtin.import_playbook: verify.yml
