---
# role: node_exporter
# file: handlers/main.yml

- name: Reload systemd units
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: reload node exporter unit

- name: Read service state before restarting the exporter
  ansible.builtin.service_facts:
  listen: restart node exporter

- name: Restart the running exporter
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: "{{ __node_exporter_service }}"
    state: restarted
  when: ansible_facts.services[__node_exporter_service].state | default('') == 'running'
  listen: restart node exporter
