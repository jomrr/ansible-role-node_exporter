---
# role: node_exporter
# file: tasks/main.yml

- name: Gather facts and load platform settings
  ansible.builtin.import_tasks: set_vars.yml

- name: Install the selected exporter and its service account
  ansible.builtin.import_tasks: install.yml
  vars:
    __node_exporter_configure: true

- name: Create the configuration directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/node_exporter
    state: directory
    owner: root
    group: node_exporter
    mode: '0710'

- name: Install the web configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: web-config.yml.j2
    dest: "{{ __node_exporter_web_config_file }}"
    owner: root
    group: node_exporter
    mode: '0640'
    backup: "{{ node_exporter_backup }}"
  no_log: true
  diff: false
  notify: restart node exporter
  when: node_exporter_web_config | length > 0

- name: Configure the metrics listener and collectors
  become: true
  become_user: root
  ansible.builtin.template:
    src: node_exporter.env.j2
    dest: /etc/node_exporter/node_exporter.env
    owner: root
    group: root
    mode: '0600'
    backup: "{{ node_exporter_backup }}"
  notify: restart node exporter

- name: Install the service unit for the selected executable
  become: true
  become_user: root
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "/etc/systemd/system/{{ __node_exporter_service }}"
    owner: root
    group: root
    mode: '0644'
    backup: "{{ node_exporter_backup }}"
    validate: "{{ __node_exporter_validate_unit }}"
  notify:
    - reload node exporter unit
    - restart node exporter

- name: Apply service changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start the exporter
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: "{{ __node_exporter_service }}"
    enabled: true
    state: started

- name: Remove the unused managed web configuration
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __node_exporter_web_config_file }}"
    state: absent
  when: node_exporter_web_config | length == 0

- name: Retire the upstream command after switching to the distribution executable
  when: node_exporter_install == 'package'
  block:
    - name: Identify the local upstream link
      ansible.builtin.stat:
        path: "{{ __node_exporter_link }}"
        get_checksum: false
      register: __node_exporter_local_command

    - name: Retire the link to the upstream release
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ __node_exporter_link }}"
        state: absent
      when: __node_exporter_local_command.stat.lnk_target | default('') is match(__node_exporter_libexec ~ '/node_exporter-[0-9]+\.[0-9]+\.[0-9]+\Z')
