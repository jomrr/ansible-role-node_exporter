---
# role: node_exporter
# file: tasks/assert.yml

- name: assert | Validate the metrics listener
  ansible.builtin.assert:
    that:
      - node_exporter_listen_address is match('\A(?:[a-zA-Z0-9.-]*|\[[a-fA-F0-9:]+\]):[0-9]{1,5}\Z')
      - 0 < node_exporter_listen_address.rsplit(':', 1)[1] | int <= 65535
    fail_msg: Use host:port, [IPv6]:port or :port with a port between 1 and 65535.
    quiet: true

- name: assert | Validate collector names and switches
  ansible.builtin.assert:
    that:
      - __node_exporter_collector.key is string and __node_exporter_collector.key is match('\A[a-z][a-z0-9_]*\Z')
      - __node_exporter_collector.value is boolean
    fail_msg: Each collector requires an upstream collector name and a boolean switch.
    quiet: true
  loop: "{{ node_exporter_collectors | dict2items }}"
  loop_control:
    loop_var: __node_exporter_collector
    label: "{{ __node_exporter_collector.key }}"

- name: assert | Validate the requested exporter release
  ansible.builtin.assert:
    that:
      - node_exporter_version == 'latest' or node_exporter_version is match('\A[0-9]+\.[0-9]+\.[0-9]+\Z')
    fail_msg: Binary installs require latest or a numeric major.minor.patch release.
    quiet: true
  when: node_exporter_install == 'binary'

- name: assert | Require an available release architecture
  ansible.builtin.assert:
    that: ansible_facts.architecture in __node_exporter_architectures
    quiet: true
    fail_msg: "No upstream binary mapping for {{ ansible_facts.architecture }}."
  when: node_exporter_install == 'binary'
