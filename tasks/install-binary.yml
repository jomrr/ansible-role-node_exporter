---
# role: node_exporter
# file: tasks/install-binary.yml

- name: install-binary | Install the release archive prerequisites
  become: true
  become_user: root
  ansible.builtin.package:
    name: [ca-certificates, gzip, tar]
    state: present

- name: install-binary | Create the local release and command directories
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __node_exporter_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ __node_exporter_libexec }}"
    - "{{ __node_exporter_link | dirname }}"
  loop_control:
    loop_var: __node_exporter_directory
    label: "{{ __node_exporter_directory }}"

- name: install-binary | Resolve the latest upstream release
  ansible.builtin.uri:
    url: "https://github.com/prometheus/node_exporter/releases/latest"
    method: HEAD
    follow_redirects: none
    use_netrc: false
    status_code: [301, 302, 303, 307, 308]
  register: __node_exporter_latest
  failed_when: >-
    __node_exporter_latest is failed or
    __node_exporter_latest_tag is not match('\Av[0-9]+\.[0-9]+\.[0-9]+\Z')
  check_mode: false
  when: node_exporter_version == 'latest'

- name: install-binary | Download and verify the release archive
  become: true
  become_user: root
  ansible.builtin.get_url:
    url: "{{ __node_exporter_download_url }}/{{ __node_exporter_release }}.tar.gz"
    use_netrc: false
    backup: "{{ node_exporter_backup }}"
    checksum: "sha256:{{ __node_exporter_download_url }}/sha256sums.txt"
    dest: "/var/cache/{{ __node_exporter_release }}.tar.gz"
    owner: root
    group: root
    mode: '0644'
  register: __node_exporter_archive

- name: install-binary | Install the versioned executable
  become: true
  become_user: root
  ansible.builtin.unarchive:
    src: "{{ __node_exporter_archive.dest }}"
    remote_src: true
    dest: "{{ __node_exporter_libexec }}"
    include:
      - "{{ __node_exporter_release }}/node_exporter"
    extra_opts:
      - '--transform=s|^.*/||'
      - '--transform=s|$|-{{ __node_exporter_version }}|'
    owner: root
    group: root
    mode: '0755'
  notify: restart node exporter

- name: install-binary | Point the local command at the selected release
  become: true
  become_user: root
  ansible.builtin.file:
    src: "{{ __node_exporter_libexec }}/node_exporter-{{ __node_exporter_version }}"
    dest: "{{ __node_exporter_link }}"
    state: link
    follow: false
  notify: restart node exporter
